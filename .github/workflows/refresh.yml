name: refresh feed

# WHY THIS IS A LOOP AND NOT A CRON
#
# GitHub's scheduler did not deliver a single `*/5` run in 33 minutes of
# watching, with the workflow active, the cron valid, on the default branch of
# a public repo. High-frequency schedules are deprioritised hard and the docs
# only promise "may be delayed". A 15-minute market cannot wait on that.
#
# Having each run dispatch its successor is not available: GitHub refuses to
# start a workflow from an action authenticated with GITHUB_TOKEN, to prevent
# recursion. The alternative is a personal access token sitting in a public
# repo's secrets, which is a standing write credential and not worth it here.
#
# So one run refreshes on its own clock for ~5.5 hours. The schedule below is
# no longer the cadence; it is only a seed. With `cancel-in-progress: false`,
# a tick that lands while a run is active becomes the queued successor and
# starts when the current one ends. GitHub keeps at most one pending run per
# concurrency group, so ticks cannot pile up.
#
# Kill switch: set the repo variable LOOP to `off` and each run does a single
# pass and exits.

on:
  schedule:
    # Neither of these is the cadence; the loop is. They exist only to restart
    # it after a run hits its deadline.
    #
    # Measured: in the 90 minutes after this workflow was created, GitHub
    # delivered ZERO scheduled runs -- 8 runs, all push or workflow_dispatch.
    # So `*/5` is kept on the chance it ever fires, and the real restart seed
    # is the 3-hourly one below. GitHub's own guidance is that high-frequency
    # schedules are deprioritised and that the top of the hour is the most
    # contended minute, so it is offset to :17. A run lasts ~5.5h, so a
    # 3-hourly tick lands while one is active, queues as its successor, and
    # takes over the moment it ends.
    #
    # CONFIRMED 2026-10-30: run 41019853995 (scheduled 07:24) ran to its
    # deadline and completed; the tick delivered at 10:05 sat pending behind
    # the concurrency group and took over with no gap in publishing. Over
    # ~13 hours GitHub delivered 2 scheduled runs, neither on the `*/5`
    # cadence -- which is all the restart needs, since each one only has to
    # relight a 5.5-hour loop. The handoff is no longer theory.
    - cron: '*/5 * * * *'
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_feed.mjs'
      - 'docs/index.html'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write             # pushes the built feed to the `feed` branch

concurrency:
  group: feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh loop
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          LOOP: ${{ vars.LOOP }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          INTERVAL=300
          DEADLINE=$(( $(date +%s) + 330*60 ))

          git config user.name  "feed bot"
          git config user.email "noreply@github.com"

          # The published commit is built with plumbing, never by switching
          # branches. An earlier version used `git switch --orphan feed`, which
          # removes every tracked file from the working tree -- so the next
          # iteration could not find scripts/fetch_feed.mjs, every build failed
          # to start, and the loop span for 11 minutes publishing nothing. The
          # working tree now stays exactly as checked out.
          #
          # read-tree --empty + add + write-tree + commit-tree produces a
          # parentless commit containing only docs/, so the `feed` branch stays
          # at a single commit instead of growing ~66 per run.
          publish() {
            local msg="$1"
            # Never publish a tree without a feed. docs/*.json is gitignored and
            # not committed to main, so a fresh checkout has none: an earlier
            # version republished docs/ on a refused build and wiped feed.json
            # off the branch, 404ing the live endpoint. Seeding from origin/feed
            # below fixes the cause; this is the backstop.
            if [ ! -f docs/feed.json ]; then
              echo "::warning::no docs/feed.json -- refusing to publish an empty tree"
              return 1
            fi
            export GIT_INDEX_FILE="$RUNNER_TEMP/feed.index"
            rm -f "$GIT_INDEX_FILE"
            git read-tree --empty
            git add -f docs
            local tree commit
            tree=$(git write-tree)
            commit=$(git commit-tree "$tree" -m "$msg")
            unset GIT_INDEX_FILE
            git push -q -f origin "$commit:refs/heads/feed"
          }

          # Written every pass, published even when the build is refused, so a
          # refusal is visible on the live site instead of only in a log that
          # does not flush until this step ends ~5.5 hours from now.
          status() {
            printf '{"last_attempt":"%s","outcome":"%s","reason":"%s","published":%s,"refused":%s,"run":"%s"}\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$1" "$2" "$PUBLISHED" "$REFUSED" "$RUN_URL" \
              > docs/status.json
          }

          # Seed docs/ with whatever is already published, so a refused build has
          # a real feed to republish alongside the fresh status. Without this
          # the runner starts with no JSON at all -- docs/*.json is gitignored
          # and lives only on the feed branch.
          if git fetch -q --depth 1 origin feed 2>/dev/null; then
            git checkout -q origin/feed -- docs 2>/dev/null \
              && echo "seeded docs/ from the feed branch" \
              || echo "feed branch has no docs/ yet"
          else
            echo "no feed branch yet -- first publish will create it"
          fi

          PUBLISHED=0
          REFUSED=0

          while :; do
            if OUT=$(node scripts/fetch_feed.mjs --out docs 2>&1); then
              PUBLISHED=$((PUBLISHED+1))
              status ok ""
              publish "feed @ $(date -u +%Y-%m-%dT%H:%MZ)"
              echo "$(date -u +%H:%M:%SZ) published #$PUBLISHED"
            else
              # Expected several times an hour: near a close every market is
              # excluded at once, just after one the API has no current event,
              # and for the first minutes of a window the targets read "TBD".
              # docs/ still holds the last good feed, so this republishes it
              # together with a fresh status.json.
              REFUSED=$((REFUSED+1))
              REASON=$(printf '%s' "$OUT" | sed -n 's/^refusing to publish -- //p' | head -1 | tr -d '"')
              status refused "${REASON:-unknown}"
              publish "status @ $(date -u +%Y-%m-%dT%H:%MZ)"
              echo "$(date -u +%H:%M:%SZ) refused #$REFUSED: ${REASON:-unknown}"
            fi

            if [ "${LOOP:-}" = "off" ]; then echo "LOOP=off, exiting"; break; fi
            NOW=$(date +%s)
            REMAIN=$(( DEADLINE - NOW ))
            [ "$REMAIN" -lt "$INTERVAL" ] && { echo "deadline reached"; break; }
            sleep "$INTERVAL"
          done

          echo "published $PUBLISHED · refused $REFUSED"

      - name: Smoke test before the job ends
        if: always()
        run: |
          # Proves the published branch is loadable and self-consistent. Runs
          # even on cancel, so a broken publish is caught here rather than by
          # someone opening the ad.
          set -e
          U=https://ginawu-applovin.github.io/public-15min-feed
          curl -sf --max-time 20 "$U/status.json" | tee /dev/stderr | \
            node -e 'const s=JSON.parse(require("fs").readFileSync(0,"utf8"));
                     if(!s.last_attempt) { console.error("no last_attempt"); process.exit(1); }'
