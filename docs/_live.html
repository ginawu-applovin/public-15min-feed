<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Public 15-Minute Markets Playable</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   Design: Figma "Creative Performance Sprints 2026" › Interactive (Light / Dark)
   All type is Inter. Theme is set by CONFIG.THEME ('light' | 'dark').
   ------------------------------------------------------------------ */
:root{
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  /* light (Figma › Interactive Light) */
  --page:#E3EAF3;
  --bg:linear-gradient(180deg,#FFFFFF 0%,#E3EAF3 100%);
  --title:#000; --text:#000; --text-2:rgba(0,0,0,.55); --hl:#00379A;
  --logo:#000; --logo-mark:#00379A;
  --lbl-bg:#FFE0CA; --lbl:#FF5E3A;
  --tab-line:rgba(120,120,120,.16); --tab-on-bg:#ECEEEF; --tab-on:#000; --tab:rgba(0,0,0,.55);
  --card:#FFFFFF; --card-line:#F1F4F7; --badge:#EEF1F5; --divider:rgba(120,120,120,.12);
  --up:#31A400; --down:#FF002B; --on-yn:#FFFFFF; --track:rgba(120,120,120,.1);
  --spark:#3D66F5;
  --dock-fade:rgba(255,255,255,.6); --more-bg:rgba(255,255,255,.25); --more-line:rgba(255,255,255,.5); --more-ico:#000;
  --cta-bg:rgba(0,0,0,.95); --cta:#FFFFFF; --legal:#516880;
  --dots-blend:hard-light;
  --sheet:#FFFFFF; --scrim:rgba(0,0,0,.35); --tip-bg:rgba(20,20,20,.92); --tip:#FFFFFF;
}
:root[data-theme="dark"]{
  /* dark (Figma › Interactive Dark) */
  --page:#3A4C5D;   /* = bottom of the dark gradient, so no seam shows under the dock */
  --bg:linear-gradient(180deg,rgba(0,0,0,.4) 50%,rgba(146,191,233,.4) 100%),#000;
  --title:#FAFAFA; --text:#E5E5E5; --text-2:rgba(255,255,255,.6); --hl:#4D74FF;
  --logo:#FFFFFF; --logo-mark:#FFFFFF;
  --lbl-bg:#3A1000; --lbl:#FF6C3B;
  --tab-line:rgba(144,144,144,.4); --tab-on-bg:rgba(144,144,144,.3); --tab-on:#E5E5E5; --tab:rgba(255,255,255,.6);
  --card:rgba(255,255,255,.05); --card-line:rgba(255,255,255,.15); --badge:rgba(255,255,255,.08); --divider:rgba(255,255,255,.08);
  --up:#80CE00; --down:#FF4646; --on-yn:#0F0F0F; --track:rgba(144,144,144,.3);
  --spark:#4D74FF;
  --dock-fade:rgba(15,15,15,.6); --more-bg:rgba(255,255,255,.25); --more-line:rgba(255,255,255,.08); --more-ico:#FFFFFF;
  --cta-bg:rgba(255,255,255,.95); --cta:#0F0F0F; --legal:#DCE2EA;
  --dots-blend:normal;
  --sheet:#14171C; --scrim:rgba(0,0,0,.6); --tip-bg:rgba(232,232,232,.96); --tip:#111111;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;padding:0;height:100%;background:var(--page);overflow:hidden}
body{display:flex;align-items:center;justify-content:center}

#stage{
  width:1080px;height:1920px;position:relative;flex:0 0 auto;overflow:hidden;
  color:var(--text);font-family:var(--sans);background:var(--bg);
  font-feature-settings:"lnum" 1,"tnum" 1;-webkit-font-smoothing:antialiased;
  padding:74px 73px 0;display:flex;flex-direction:column;
}
/* dot texture — Figma background vectors (dots.svg), placed as in the Interactive frames */
/* dark: the Figma's overlay blend vanishes on black, so the dots are drawn in a light blue-grey instead */
:root[data-theme="dark"] #dots path{stroke:#AFD0E8;opacity:.42}
#stage>#dots{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;z-index:0;mix-blend-mode:var(--dots-blend)}
#stage>*{position:relative;z-index:1}

/* ---------- header ---------- */
#hdr{flex:0 0 auto}
#logo{display:block;height:57px;width:auto;margin-left:12px;color:var(--logo)}
#logo .mark{fill:var(--logo-mark)}
#cdl{display:inline-flex;align-items:center;flex:0 0 auto;padding:8.33px 16.67px;border-radius:999px;
  background:var(--lbl-bg);color:var(--lbl);font:600 27.78px/1.2 var(--sans);font-variant-numeric:tabular-nums}
#title{margin:61px 0 0;font:500 80px/1.1 var(--sans);letter-spacing:-2px;color:var(--title)}
#title .hl{color:var(--hl)}

/* ---------- tabs ---------- */
#right{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#tabrow{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:16px;flex:0 0 auto}
#tabs{display:flex;gap:17.2px}
.tab{border:2.15px solid var(--tab-line);border-radius:17.2px;padding:17.2px 25.8px;
  font:600 30.14px/1.4 var(--sans);color:var(--tab);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab.on{background:var(--tab-on-bg);color:var(--tab-on)}

/* ---------- market list (scrolls under the dock) ---------- */
#cards{flex:1 1 auto;min-height:0;overflow-y:auto;margin:38px -73px 0;padding:0 73px 400px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
#cards::-webkit-scrollbar{display:none}
.card{position:relative;background:var(--card);border:2.6px solid var(--card-line);border-radius:22px;
  padding:42px;display:flex;flex-direction:column;gap:33px}
.card+.card{margin-top:24px}
.ch{display:flex;align-items:center;gap:23px}
.ico{flex:0 0 60px;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:var(--badge);color:var(--text-2);font:700 28px/1 var(--sans);letter-spacing:-.5px}
.ico.sm{font-size:20px} .ico.xs{font-size:16px}
.card h3{margin:0;flex:1;min-width:0;font:600 49.3px/64.87px var(--sans);color:var(--text)}
.card h3 b{color:var(--hl);font-weight:600}
.cd{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:53px}
.cd .now{font:600 31.14px/1.2 var(--sans);color:var(--text-2);font-variant-numeric:tabular-nums;white-space:pre;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cd svg{width:194px;height:48px;flex:0 0 auto;overflow:visible}
.cd path{stroke:var(--spark)}

.bar{display:flex;gap:10.38px;height:5.19px}
.bar i{display:block;height:100%;border-radius:10.38px;transition:flex-basis .6s ease}
.bar .y{background:var(--up)} .bar .n{background:var(--down);flex:1 1 0}

.btns{display:flex;gap:31.14px}
.chip{flex:1 1 0;border-radius:999px;padding:31.14px 36px;text-align:center;cursor:pointer;white-space:nowrap;
  font:600 36px/1.4 var(--sans);color:var(--on-yn);font-variant-numeric:tabular-nums;transition:transform .1s}
.chip.y{background:var(--up)} .chip.n{background:var(--down)}
.chip:active{transform:scale(.97)}
.flash{animation:flash .6s}
@keyframes flash{0%{filter:brightness(1.18)}100%{filter:none}}

/* strike ladders (Commodities): "$4,030 or above" rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:28px}
.row+.row{border-top:2px solid var(--divider);margin-top:30px;padding-top:30px}
.row .l{flex:1;min-width:0}
.row .k{font:600 36px/1.2 var(--sans);color:var(--text);margin-bottom:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .btns{flex:0 0 auto;gap:16px}
.row .chip{flex:0 0 auto;min-width:176px;padding:22px 26px;font-size:32px}

/* ---------- dock (Figma › Dock 3.0) ---------- */
#foot{position:absolute;left:0;right:0;bottom:-4px;z-index:5;padding:60.9px 60.9px 64.9px;display:flex;flex-direction:column;align-items:center;gap:12px}
#foot::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,0) 0%,var(--dock-fade) 70%);
  -webkit-backdrop-filter:blur(5.5px);backdrop-filter:blur(5.5px);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30%);mask-image:linear-gradient(180deg,transparent 0,#000 30%)}
#more{width:98.6px;height:98.6px;border-radius:50%;background:var(--more-bg);border:2.6px solid var(--more-line);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .2s;animation:bob 1.6s ease-in-out infinite}
#more svg{width:31px;height:31px;stroke:var(--more-ico)}
#more.off{opacity:0;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
#cta{display:block;width:100%;border:0;border-radius:999px;background:var(--cta-bg);color:var(--cta);
  font:600 38.77px/1.4 var(--sans);padding:44.3px 60.9px;cursor:pointer;transition:transform .1s}
#cta:active,#buy:active{transform:scale(.98)}
#legal{width:895px;max-width:100%;font:400 20px/1.4 var(--sans);color:var(--legal);text-align:center}

/* ---------- order sheet ---------- */
#scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);border-top:2.6px solid var(--card-line);
  border-radius:48px 48px 0 0;padding:28px 73px 56px;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);color:var(--text)}
#sheet.on{transform:none}
.grab{width:96px;height:10px;border-radius:99px;background:var(--divider);margin:0 auto 34px}
#x{position:absolute;right:48px;top:40px;width:76px;height:76px;border-radius:50%;border:2.15px solid var(--tab-line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);font:400 44px/1 var(--sans)}
.s-sub{font:600 30px/1.3 var(--sans);color:var(--text-2);margin-bottom:12px;padding-right:100px}
.s-sub b{color:var(--lbl)}
.s-title{font:600 54px/1.1 var(--sans);margin-bottom:36px;font-variant-numeric:tabular-nums}
.sides{display:flex;gap:22px;margin-bottom:34px}
.side{flex:1;border:2.6px solid var(--tab-line);border-radius:28px;padding:30px 20px;text-align:center;cursor:pointer;transition:all .15s}
.side .n{font:600 32px/1 var(--sans);color:var(--text-2);margin-bottom:14px}
.side .p{font:600 64px/1 var(--sans);font-variant-numeric:tabular-nums}
.side.on[data-side=yes]{background:var(--up);border-color:var(--up);color:var(--on-yn)}
.side.on[data-side=no]{background:var(--down);border-color:var(--down);color:var(--on-yn)}
.side.on .n{color:var(--on-yn)}
.lbl{font:600 28px/1 var(--sans);color:var(--text-2);margin-bottom:18px}
.amts{display:flex;gap:16px;margin-bottom:34px}
.amt{flex:1;border:2.15px solid var(--tab-line);border-radius:17.2px;padding:24px 0;text-align:center;
  font:600 36px/1 var(--sans);cursor:pointer;transition:all .15s;color:var(--tab)}
.amt.on{background:var(--tab-on-bg);color:var(--tab-on)}
.sum{border:2.6px solid var(--card-line);border-radius:22px;padding:16px 34px;margin-bottom:34px}
.sum .r{display:flex;justify-content:space-between;padding:18px 0;font:600 32px/1 var(--sans);font-variant-numeric:tabular-nums}
.sum .r+.r{border-top:2px solid var(--divider)}
.sum .r span{color:var(--text-2);font-weight:500}
.sum .r.big b{font-size:44px;color:var(--hl)}
#buy{display:block;width:100%;border:0;border-radius:999px;background:var(--cta-bg);color:var(--cta);
  font:600 38.77px/1.4 var(--sans);padding:40px;cursor:pointer;transition:transform .1s}
.fine{margin-top:22px;text-align:center;font:400 22px/1.4 var(--sans);color:var(--text-2)}

/* ---------- tap hint ---------- */
.hint{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:6}
.hint .hand{position:absolute;left:-40px;top:0;font-size:96px;line-height:1;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));animation:tap 1.3s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(22px)}45%{transform:translateY(0) scale(.94)}}
.hint .tip{position:absolute;top:122px;transform:translateX(-50%);white-space:nowrap;
  background:var(--tip-bg);color:var(--tip);font:600 40px/1 var(--sans);padding:26px 46px;border-radius:999px;
  box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* ---------- landscape (AppLovin requires both orientations) ---------- */
#stage.ls{display:grid;grid-template-columns:42% 1fr;grid-template-rows:auto 1fr;column-gap:80px;padding:60px 80px 0}
#stage.ls #hdr{grid-area:1/1/2/2}
#stage.ls #right{grid-area:1/2/3/3;min-height:0}
#stage.ls #tabrow{margin-top:0}
#stage.ls #cards{margin:28px -80px 0 0;padding:0 80px 60px 0}
#stage.ls #title{font-size:72px}
#stage.ls #foot{position:static;grid-area:2/1/3/2;align-self:end;padding:0 0 44px}
#stage.ls #foot::before,#stage.ls #more{display:none}
#stage.ls .card{padding:30px 36px;gap:22px}
#stage.ls .card h3{font-size:42px;line-height:54px}
#stage.ls .chip{padding:22px 30px;font-size:32px}
#stage.ls .row .chip{padding:16px 22px;font-size:28px;min-width:150px}
#stage.ls #sheet{left:auto;width:1000px;right:0;top:0;bottom:0;border-radius:48px 0 0 48px;border-top:0;border-left:2.6px solid var(--card-line);
  padding:44px 64px 36px;transform:translateX(105%)}
#stage.ls #sheet.on{transform:none}
#stage.ls .grab{display:none} #stage.ls #x{top:36px}
#stage.ls .s-title{font-size:46px;margin-bottom:24px}
#stage.ls .sides,#stage.ls .amts,#stage.ls .sum{margin-bottom:22px}
#stage.ls .side{padding:20px} #stage.ls .side .p{font-size:52px}
#stage.ls .amt{padding:18px 0} #stage.ls .sum .r{padding:12px 0}
#stage.ls #buy{padding:30px} #stage.ls .fine{margin-top:14px}
</style>
</head>

/* ---- 1080x1920 / 1920x1080 zoom scaling (zoom, not transform — transform clips on iOS Safari) ---- */
function scaleStage(){
  const vw = (window.visualViewport && window.visualViewport.width)  || window.innerWidth;
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  const ls = vw > vh, st = $('stage');
  /* base canvas 1080x1920 (or 1920x1080); stretch the long side to fill taller/wider
     devices, and widen up to 1.33x on squarer screens (tablets) instead of letterboxing */
  const B = ls ? [1920,1080] : [1080,1920], r = vw / vh, br = B[0] / B[1];
  const dim = r < br ? [B[0], Math.round(B[0] / r)] : [Math.min(Math.round(B[1] * r), Math.round(B[0] * 1.33)), B[1]];
  st.style.width = dim[0]+'px'; st.style.height = dim[1]+'px';
  st.classList.toggle('ls', ls);
  const z = Math.min(vw/dim[0], vh/dim[1]); st.style.zoom = z;
  st.style.height = Math.max(dim[1], Math.ceil(vh / z)) + 'px';   // fill to the last pixel, so the dock meets the bottom edge
  updateMore();
}

/* ---- MRAID (AppLovin: wait for ready before layout; CTA via mraid.open) ---- */
function whenReady(fn){

}
/* campaign -> override -> store by OS.

   macro ('{CLICK_URL}') falls through to the store instead of opening garbage.
   Android goes to Play, everything else to the App Store; a desktop preview
   lands on the Apple page, which is fine for review. */
function isUrl(v){ return typeof v === 'string' && /^https?:\/\//i.test(v); }
function storeUrl(){
  var S = CONFIG.STORE_URL;
  if (typeof S === 'string') return S;
  if (isUrl(S.campaign)) return S.campaign;
  if (isUrl(S.override)) return S.override;
  return /Android/i.test(navigator.userAgent || '') ? S.android : S.ios;
}

}

/* ---- tap guard: one gesture never fires twice ---- */
let lock = 0;
const guard = fn => function(e){ if (e) e.stopPropagation(); const n = Date.now(); if (n < lock) return; lock = n + 250; fn.apply(this, arguments); };

/* ---- time + number helpers ---- */
const WINDOW = 15*60*1000;
const nextClose = t => Math.ceil((t+1)/WINDOW)*WINDOW;
/* A fed close_time that has already passed means the snapshot outlived its
   window -- the feed is rebuilt on a schedule, not per tick, so this is normal
   rather than an error. Windows sit on fixed quarter-hour boundaries, so the
   honest repair is to roll to the next one: the countdown stays truthful about
   when the current window ends, and the prices stay flagged as last-known.
   A fresh feed passes through untouched. */
const rollClose = t => (t && t > Date.now()) ? t : nextClose(Date.now());
let fmtTime;
try { const f = new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',timeZone:CONFIG.TIMEZONE,timeZoneName:'short'}); fmtTime = d => f.format(d); }
catch(e){ fmtTime = d => d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }

const num = (v, dp) => v.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const money = (v, dp) => '$' + num(v, dp);
const fmtVal = (m, v, dp) => { dp = dp == null ? m.dp : dp;
  return m.unit === 'pct' ? num(v, dp) + '%' : m.unit === 'fx' ? num(v, dp) : money(v, dp); };

/* ---- pricing for the simulator (driftless lognormal) ---- */
function ncdf(x){ const t=1/(1+.2316419*Math.abs(x)), d=.3989423*Math.exp(-x*x/2);
  const p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return x>0?1-p:p; }
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const YEAR_S = 31536000;
const clampC = p => Math.min(99, Math.max(1, Math.round(p)));

/* ---- model ---- */
let MARKETS = [], isLive = false;
const catalog = sym => CONFIG.SAMPLE.find(s => s.symbol === sym) || {};

function sampleLadder(m){
  const base = Math.round(m.spot/m.inc)*m.inc, ks = [];
  for (let i=-6;i<=6;i++) ks.push(+(base + i*m.inc).toFixed(6));
  m.ladder = ks.map(k => ({ id: m.id+'-'+m.close+'-'+k, floor:k, yes:50 }));
}
/* Show the strikes closest to the money (yes nearest 50¢), highest strike first —
   same rule for sample and live, so the feed can send the full ladder. */
function pickStrikes(m){
  if (m.type !== 'strike') { m.strikes = []; return; }
  m.strikes = m.ladder.slice().sort((a,b) => Math.abs(a.yes-50) - Math.abs(b.yes-50) || Math.abs(a.floor-m.spot) - Math.abs(b.floor-m.spot))
    .slice(0, CONFIG.STRIKES_PER_MARKET).sort((a,b) => b.floor - a.floor);
}
function priceSample(m, now){
  const sd = m.vol*Math.sqrt(Math.max(360, (m.close - now)/1000)/YEAR_S);
  if (m.type === 'updown'){ m.up = clampC(ncdf(Math.log(m.spot/m.open)/sd)*100); return; }
  m.ladder.forEach(s => { s.yes = clampC(ncdf(Math.log(m.spot/s.floor)/sd)*100); });
  pickStrikes(m);
}
function initSample(){
  const now = Date.now();
  MARKETS = CONFIG.SAMPLE.map(s => {
    const m = Object.assign({}, s, { close: nextClose(now), hist: [] });
    let p = m.spot; const step = m.vol/Math.sqrt(YEAR_S);       // seed ~2 min of history
    for (let i=0;i<60;i++){ m.hist.unshift(p); p *= Math.exp(-gauss()*step*2); }
    m.open = m.hist[Math.floor(m.hist.length/3)];                // window "opened" a bit ago
    if (m.type === 'strike') sampleLadder(m);
    priceSample(m, now);
    return m;
  });
}
function tickSample(now){
  MARKETS.forEach(m => {
    const prev = m.spot;
    m.spot *= Math.exp(gauss()*m.vol/Math.sqrt(YEAR_S)*1.6);    // slightly lively for demo
    m.dir = m.spot > prev ? 1 : -1;
    m.hist.push(m.spot); if (m.hist.length > 60) m.hist.shift();
    if (now >= m.close){ m.close = nextClose(now); m.open = m.spot; if (m.type === 'strike') sampleLadder(m); }
    priceSample(m, now);
  });
}

/* ---- live feed ---- */
function normalize(json){
  const list = CONFIG.FEED.parse ? CONFIG.FEED.parse(json) : (json.markets || json);
  if (!Array.isArray(list)) return null;
  let max = 0;
  list.forEach(m => { max = Math.max(max, +m.up_price || 0); (m.strikes||[]).forEach(s => { max = Math.max(max, +s.yes_price || 0); }); });
  const sc = max > 1.5 ? 1 : 100;
  const out = [];
  CONFIG.SAMPLE.forEach(cat => {                      // keep catalog (tab) order
    const m = list.find(x => x.symbol === cat.symbol); if (!m) return;
    const old = MARKETS.find(o => o.symbol === cat.symbol) || {};
    const spot = +m.spot;
    const mk = Object.assign({}, cat, {
      id: String(m.id), lane: m.lane || cat.lane, type: m.type || cat.type,
      spot, open: +m.open || old.open || spot,
      dir: old.spot ? (spot >= old.spot ? 1 : -1) : 0,
      hist: (old.symbol === cat.symbol && old.id === String(m.id) ? old.hist : []).concat([spot]).slice(-60),
      close: rollClose(Date.parse(m.close_time)),
      up: clampC((+m.up_price || 0) * sc),
      ladder: (m.strikes||[]).map(s => ({ id:String(s.id), floor:+s.floor, yes: clampC((+s.yes_price)*sc) }))
    });
    pickStrikes(mk);
    if (mk.spot && mk.close && (mk.type === 'updown' || mk.strikes.length)) out.push(mk);
  });
  return out;
}
async function fetchLive(){
  /* Measured 2026-10-29: Pages serves this with cache-control: max-age=600 AND
     strips the query string at the edge -- two distinct nonces both returned
     x-cache: HIT. So this buster does NOT beat the CDN; nothing in the creative
     can. It is kept only for intermediate proxies and webview caches that do
     key on the query. The real staleness budget is in README, "Staleness". */
  const bust = (CONFIG.FEED.url.indexOf('?') < 0 ? '?' : '&') + 't=' + Math.floor(Date.now()/60000);
  const r = await fetch(CONFIG.FEED.url + bust, { cache:'no-store' });
  if (!r.ok) throw new Error('feed '+r.status);
  const ms = normalize(await r.json());
  if (ms && ms.length){ MARKETS = ms; isLive = true; }
}

/* ---- UI state ---- */
let lane = CONFIG.LANES[0].id, touched = false, builtLane = null, builtIds = '';
let order = null;   // { marketId, symbol, strikeId, floor, side }
const els = {};     // marketId -> DOM refs

const laneMarkets = () => MARKETS.filter(m => m.lane === lane);
const cardKey = m => m.id + '|' + m.type + '|' + (m.strikes||[]).map(s => s.id).join(',');

function sparkPath(h){
  if (h.length < 2) return '';
  const min = Math.min.apply(null,h), max = Math.max.apply(null,h), rng = (max-min)||1;
  return h.map((v,i) => (i?'L':'M') + (i*200/(h.length-1)).toFixed(1) + ',' + (48 - (v-min)/rng*44).toFixed(1)).join(' ');
}
const ARROW_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const ARROW_DN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>';

/* Hand + pill: fingertip on the first Yes/Up button, pill centered on the card.
   Positioned from offsets inside the card, so it scrolls with the list. */
function addHint(card, target){
  const h = document.createElement('div'); h.className = 'hint';
  h.innerHTML = '<div class="hand">\uD83D\uDC46</div><div class="tip"></div>';
  h.querySelector('.tip').textContent = C.tapHint;
  h._target = target; card.appendChild(h);
}
function placeHints(){
  document.querySelectorAll('.hint').forEach(h => {
    const t = h._target, card = h.parentNode; if (!t || !card) return;
    let x = t.offsetWidth/2, y = t.offsetHeight*0.55, n = t;
    while (n && n !== card){ x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
    h.style.left = x + 'px'; h.style.top = y + 'px';
    h.querySelector('.tip').style.left = (card.clientWidth/2 - x) + 'px';
  });
}
function dismissHints(){ touched = true; document.querySelectorAll('.hint').forEach(h => h.remove()); }

function buildCard(m, first){
  const c = document.createElement('div'); c.className = 'card';
  c.innerHTML =
    '<div class="ch"><div class="ico"></div><h3></h3></div>' +
    '<div class="cd"><span class="now"></span><svg viewBox="0 0 200 52" preserveAspectRatio="none"><path fill="none" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></div>';
  const ico = c.querySelector('.ico'), logo = (CONFIG.LOGOS || {})[m.symbol];
  if (logo){ const img = new Image(); img.src = logo; img.alt = m.symbol; img.style.cssText = 'width:100%;height:100%;display:block';
    ico.style.background = 'none'; ico.appendChild(img); }
  else {
    ico.textContent = m.icon; if (m.icon.length === 3) ico.classList.add('sm'); else if (m.icon.length > 3) ico.classList.add('xs');
    if (m.badge){ ico.style.background = m.badge[0]; ico.style.color = m.badge[1]; }
  }
  const ref = { key:cardKey(m), card:c, h3:c.querySelector('h3'), now:c.querySelector('.now'), path:c.querySelector('.cd path'), rows:{} };

  if (m.type === 'updown'){
    const bar = document.createElement('div'); bar.className = 'bar'; bar.innerHTML = '<i class="y"></i><i class="n"></i>';
    const btns = document.createElement('div'); btns.className = 'btns';
    btns.innerHTML = '<div class="chip y" data-side="yes"></div><div class="chip n" data-side="no"></div>';
    const [cu, cd] = btns.querySelectorAll('.chip');
    cu.addEventListener('click', guard(() => openSheet(m.id, null, 'yes')));
    cd.addEventListener('click', guard(() => openSheet(m.id, null, 'no')));
    c.append(bar, btns);
    if (first && !touched) addHint(c, cu);
    ref.ud = { by:bar.querySelector('.y'), bn:bar.querySelector('.n'), cu, cd, last:null };
  } else {
    const rows = document.createElement('div'); rows.className = 'rows';
    m.strikes.forEach((s, si) => {
      const r = document.createElement('div'); r.className = 'row';
      r.innerHTML = '<div class="l"><div class="k"></div><div class="bar"><i class="y"></i><i class="n"></i></div></div>' +
                    '<div class="btns"><div class="chip y"></div><div class="chip n"></div></div>';
      r.querySelector('.k').textContent = fill(C.orAbove, { k: fmtVal(m, s.floor, m.sdp) });
      const cy = r.querySelector('.chip.y'), cn = r.querySelector('.chip.n');
      cy.addEventListener('click', guard(() => openSheet(m.id, s.id, 'yes')));
      cn.addEventListener('click', guard(() => openSheet(m.id, s.id, 'no')));
      rows.appendChild(r);
      if (first && si === 0 && !touched) addHint(c, cy);
      ref.rows[s.id] = { by:r.querySelector('.bar .y'), bn:r.querySelector('.bar .n'), cy, cn, last:null };
    });
    c.appendChild(rows);
  }
  els[m.id] = ref;
  return c;
}

function flash(chip, ref, v){
  if (ref.last != null && ref.last !== v){ chip.classList.remove('flash'); void chip.offsetWidth; chip.classList.add('flash'); }
}

function syncCards(){
  const box = $('cards'), ms = laneMarkets();
  const ids = ms.map(m => m.id).join(',');
  if (builtLane !== lane || builtIds !== ids){        // new tab, or the feed swapped the market set
    const keep = builtLane === lane ? box.scrollTop : 0;
    box.innerHTML = ''; for (const k in els) delete els[k];
    ms.forEach((m, i) => box.appendChild(buildCard(m, i === 0)));
    box.scrollTop = keep; builtLane = lane; builtIds = ids;
    return;
  }
  // replace only cards whose strike set changed — keeps the user's scroll position
  ms.forEach((m, i) => {
    const e = els[m.id];
    if (e.key !== cardKey(m)){ const n = buildCard(m, i === 0 && !touched); box.replaceChild(n, e.card); }
  });
}

const barFlex = p => '0 0 calc(' + p + '% - 5.19px)';
function updateCards(now){
  laneMarkets().forEach(m => {
    const e = els[m.id]; if (!e) return;
    const t = fmtTime(new Date(m.close));
    const q = fill(m.type === 'updown' ? C.updownQ : C.strikeQ, { q: m.q, time: '\u0000' }).split('\u0000');
    if (e.h3.dataset.t !== t){
      e.h3.innerHTML = ''; e.h3.append(q[0]);
      const b = document.createElement('b'); b.textContent = t; e.h3.append(b, q[1] || '');
      e.h3.dataset.t = t;
    }
    /* The feed has no live tick, so it sets spot = open. Printing both would
       show the same number twice and read as a bug, so show the target alone
       until a real spot arrives. A feed that does carry a distinct spot falls
       through to the full line unchanged. See README, "Known gaps". */
    e.now.textContent = (m.type === 'updown' && m.spot === m.open)
      ? C.target + ' ' + fmtVal(m, m.open)
      : C.now + ' ' + fmtVal(m, m.spot) + (m.type === 'updown' ? '  |  ' + C.target + ' ' + fmtVal(m, m.open) : '');
    e.path.setAttribute('d', sparkPath(m.hist));
    if (m.type === 'updown'){
      const u = e.ud;
      u.cu.textContent = C.up + ' ' + m.up + '%'; u.cd.textContent = C.down + ' ' + (100 - m.up) + '%';
      u.by.style.flex = barFlex(m.up);
      flash(u.cu, u, m.up); flash(u.cd, u, m.up); u.last = m.up;
    } else {
      m.strikes.forEach(s => {
        const r = e.rows[s.id]; if (!r) return;
        r.cy.textContent = C.yes + ' ' + s.yes + '%'; r.cn.textContent = C.no + ' ' + (100 - s.yes) + '%';
        r.by.style.flex = barFlex(s.yes);
        flash(r.cy, r, s.yes); flash(r.cn, r, s.yes); r.last = s.yes;
      });
    }
  });
}

/* ---- "more below" chevron ---- */
function updateMore(){
  const b = $('cards'); if (!b) return;
  $('more').classList.toggle('off', b.scrollTop + b.clientHeight >= b.scrollHeight - 140);
}

/* ---- order sheet ---- */
function findOrder(){
  const m = MARKETS.find(x => x.id === order.marketId) || MARKETS.find(x => x.symbol === order.symbol);
  if (!m) return {};
  if (m.type === 'updown') return { m, yes: m.up };
  const s = (m.ladder||[]).find(x => x.id === order.strikeId) || (m.ladder||[]).find(x => x.floor === order.floor) || m.strikes[0];
  return s ? { m, s, yes: s.yes } : {};
}
function openSheet(mid, sid, side){
  dismissHints();
  const m = MARKETS.find(x => x.id === mid), s = sid ? m.ladder.find(x => x.id === sid) : null;
  order = { marketId:mid, symbol:m.symbol, strikeId:sid, floor:s ? s.floor : null, side, amount:CONFIG.DEFAULT_AMOUNT };
  renderSheet();
  $('scrim').classList.add('on'); $('sheet').classList.add('on');
}
function closeSheet(){ $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); order = null; }
function renderSheet(){
  if (!order) return;
  const { m, s, yes } = findOrder(); if (!m || yes == null){ closeSheet(); return; }
  order.marketId = m.id; if (s) order.strikeId = s.id;
  const ud = m.type === 'updown', now = Date.now();
  $('s-sub').innerHTML = '';
  $('s-sub').append(fill(ud ? C.updownQ : C.strikeQ, { q:m.q, time:fmtTime(new Date(m.close)) }) + '  ·  ' + C.closes + ' ');
  const cd = document.createElement('b'); cd.textContent = mmss(m.close - now); $('s-sub').append(cd);
  $('s-title').textContent = ud ? fill(C.upFrom, { v: fmtVal(m, m.open) }) : fill(C.orAbove, { k: fmtVal(m, s.floor, m.sdp) });
  $('n-yes').textContent = ud ? C.up : C.yes; $('n-no').textContent = ud ? C.down : C.no;
  const no = 100 - yes, px = order.side === 'yes' ? yes : no;
  $('p-yes').textContent = yes + '¢'; $('p-no').textContent = no + '¢';
  document.querySelectorAll('.side').forEach(el => el.classList.toggle('on', el.dataset.side === order.side));
  document.querySelectorAll('.amt').forEach(el => el.classList.toggle('on', +el.dataset.v === order.amount));
  const n = Math.floor(order.amount / (px/100)), cost = n*px/100;
  const rows = [[C.contracts, n + ' @ ' + px + '¢', ''], [C.cost, money(cost,2), ''],
                [C.ifRight, money(n,2), 'big'], [C.ifWrong, '$0.00', '']];
  const sum = $('sum'); sum.innerHTML = '';
  rows.forEach(r => { const d = document.createElement('div'); d.className = 'r ' + r[2];
    const a = document.createElement('span'); a.textContent = r[0]; const b = document.createElement('b'); b.textContent = r[1];
    d.append(a, b); sum.appendChild(d); });
}

/* ---- static build ---- */
function buildStatic(){
  const title = $('title'); title.append(C.titleA);
  const hl = document.createElement('span'); hl.className = 'hl'; hl.textContent = C.titleB; title.append(hl, C.titleC || '');
  $('cta').textContent = C.cta; $('legal').textContent = C.legal;
  $('buy').textContent = C.buy; $('fine').textContent = C.fine; $('amt-lbl').textContent = C.pickAmt;

  CONFIG.LANES.forEach(l => {
    const t = document.createElement('div'); t.className = 'tab'; t.dataset.lane = l.id; t.textContent = l.label;
    t.addEventListener('click', guard(() => { if (lane !== l.id){ lane = l.id; render(); } }));
    $('tabs').appendChild(t);
  });
  CONFIG.AMOUNTS.forEach(v => {
    const a = document.createElement('div'); a.className = 'amt'; a.dataset.v = v; a.textContent = '$'+v;
    a.addEventListener('click', e => { e.stopPropagation(); order.amount = v; renderSheet(); });
    $('amts').appendChild(a);
  });
  document.querySelectorAll('.side').forEach(s => s.addEventListener('click', e => { e.stopPropagation(); order.side = s.dataset.side; renderSheet(); }));
  $('x').addEventListener('click', guard(closeSheet));
  $('scrim').addEventListener('click', guard(closeSheet));
  $('cta').addEventListener('click', openStore);
  $('buy').addEventListener('click', openStore);
  $('cards').addEventListener('scroll', updateMore, { passive:true });
  // first touch anywhere (tap, scroll, tab) clears the hand hint
  $('stage').addEventListener('pointerdown', () => { if (!touched) dismissHints(); }, { passive:true });
  $('stage').addEventListener('touchstart', () => { if (!touched) dismissHints(); }, { passive:true });
  $('more').addEventListener('click', () => {
    const b = $('cards'), step = (b.querySelector('.card') || {}).offsetHeight || 400;
    try { b.scrollBy({ top: step + 24, behavior:'smooth' }); } catch(e){ b.scrollTop += step + 24; }
  });
}

/* ---- render loop ---- */
function render(){
  const ms = laneMarkets(), nowT = Date.now();
  const close = ms.length ? Math.min.apply(null, ms.map(m => m.close)) : nextClose(nowT);
  $('cdl').textContent = fill(C.left, { t: mmss(close - nowT) });
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.lane === lane));
  syncCards();
  updateCards(Date.now());
  renderSheet();
  updateMore();
  placeHints();
}

whenReady(function(){
  initSample();
  buildStatic();
  render();
  scaleStage();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scaleStage);

  setInterval(function(){
    if (!isLive) tickSample(Date.now());
    render();
  }, 1000);

  if (CONFIG.FEED.url){
    const pull = () => fetchLive().then(render).catch(function(){ /* keep last good data */ });
    pull(); setInterval(pull, CONFIG.FEED.refreshMs);
  }
});
</script>
